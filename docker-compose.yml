version: '3.8'

services:
  # App Next.js - FastLeads
  fastleads-app:
    build:
      context: https://github.com/maicondouglasx83-cpu/fastleads.git#main
      dockerfile: Dockerfile
    container_name: fastleads_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_APP_LOCALE=pt-BR
      - NEXT_PUBLIC_SUPABASE_URL=https://xgvqukojnhmobhcvhjsy.supabase.co
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_U2hJ-NxfkFIHYGPrulJfCA_u6VADmSf
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
      - ENCRYPTION_KEY=42b6229f0f541dc321a474e67164a2d35354095521ef680c78df8ec347c282a1
      - META_APP_SECRET=${META_APP_SECRET:-your-meta-app-secret}
    depends_on:
      - postgres

  # PostgreSQL com suporte a pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fastleads_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastleads}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
